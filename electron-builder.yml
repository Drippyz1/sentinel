appId: io.github.drippyz1.sentinel
productName: Sentinel
directories:
  buildResources: build
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - LICENSE
  - resources/icon.png
  - resources/tray-icon*.png
asarUnpack:
  - resources/**
  - out/main/storage-scan.js
  - out/main/duplicate-scan.js
  - out/main/chunks/**
win:
  executableName: sentinel
  icon: resources/icon.ico
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: resources/icon.icns
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  target:
    - dmg
    - zip
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  icon: resources/icon.png
  syncDesktopName: true
  target:
    - AppImage
    - deb
  maintainer: Drippyz1 <48750045+Drippyz1@users.noreply.github.com>
  category: Utility
  artifactName: ${name}-${version}-${arch}.${ext}
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: true
publish: null
