name: Release Candidates

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Candidate platform (macOS and Windows require public signing credentials)
        required: true
        type: choice
        default: linux
        options: [linux, mac, win]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref_type == 'tag' && contains(fromJSON('["linux","mac","win"]'), inputs.platform)
    name: ${{ inputs.platform }} ${{ matrix.arch }}
    runs-on: ${{ fromJSON('{"linux":{"x64":"ubuntu-24.04","arm64":"ubuntu-24.04-arm"},"mac":{"x64":"macos-15-intel","arm64":"macos-15"},"win":{"x64":"windows-2025","arm64":"windows-11-arm"}}')[inputs.platform][matrix.arch] }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - run: npm run verify:version
      - run: npm test
      - name: Build signed and notarized macOS candidate
        if: inputs.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$APPLE_API_KEY_BASE64" ]]; then
            umask 077
            export APPLE_API_KEY="$RUNNER_TEMP/sentinel-notary.p8"
            trap 'rm -f "$APPLE_API_KEY"' EXIT
            printf '%s' "$APPLE_API_KEY_BASE64" | /usr/bin/base64 -D > "$APPLE_API_KEY"
            unset APPLE_API_KEY_BASE64
          fi
          npm run dist:mac:release
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.MAC_CSC_NAME }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build signed Windows candidate
        if: inputs.platform == 'win'
        run: npm run dist:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Verify Windows installer signatures
        if: inputs.platform == 'win'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist -File -Filter *-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer." }
          if ((Get-AuthenticodeSignature $installers[0].FullName).Status -ne "Valid") {
            throw "Installer Authenticode signature is not valid."
          }
      - name: Build Linux candidate
        if: inputs.platform == 'linux'
        run: npm run dist:linux
      - name: Stage verified files and checksums
        shell: bash
        env:
          CANDIDATE_PLATFORM: ${{ inputs.platform }}
          CANDIDATE_ARCH: ${{ matrix.arch }}
        run: node scripts/release/stage-candidate.cjs "$CANDIDATE_PLATFORM" "$CANDIDATE_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-${{ inputs.platform }}-${{ matrix.arch }}-${{ github.ref_name }}
          path: dist/release-candidate/
          if-no-files-found: error
